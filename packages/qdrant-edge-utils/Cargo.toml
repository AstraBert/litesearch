[package]
name = "qdrant-edge-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
napi = { version = "3.8.3", features = ["anyhow"] }
napi-derive = "3.5.2"
ordered-float = "5.1.0"
qdrant-edge = "0.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[lib]
crate-type = ["cdylib"]

[build-dependencies]
napi-build = "1"
